<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mzuzu University Portal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:linear-gradient(135deg,#0a2b3e,#1a4a6f);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:white;border-radius:20px;padding:40px;width:100%;max-width:500px;text-align:center}
        h1{color:#0a2b3e;margin-bottom:10px}
        input,select{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ddd}
        button{width:100%;padding:12px;background:#1a4a6f;color:white;border:none;border-radius:10px;cursor:pointer;font-size:16px}
        .contact{background:#f5f5f5;padding:15px;border-radius:10px;margin-top:20px;font-size:12px}
        .error{color:red;margin-top:10px}
        .role-tabs{display:flex;gap:10px;margin-bottom:20px}
        .role-tab{flex:1;padding:10px;cursor:pointer;border-radius:10px;background:#e0e0e0}
        .role-tab.active{background:#1a4a6f;color:white}
        .hint{font-size:11px;color:#666;margin-top:-8px;margin-bottom:10px;text-align:left}
        .program-list{max-height:150px;overflow-y:auto;border:1px solid #ddd;border-radius:10px;margin-top:5px}
        .program-item{padding:10px;cursor:pointer;border-bottom:1px solid #eee}
        .program-item:hover{background:#e0f2fe}
        .selected-program{background:#e0f2fe;padding:10px;border-radius:10px;margin-top:5px;font-size:13px}
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Mzuzu University</h1>
        <p>Student - Lecturer Portal</p>
        
        <div class="role-tabs">
            <div class="role-tab active" onclick="setRole('lecturer')">👨‍🏫 Lecturer</div>
            <div class="role-tab" onclick="setRole('student')">👩‍🎓 Student</div>
        </div>
        
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div id="passwordHint" class="hint"></div>
        
        <div id="programSection" style="display:none">
            <label>Program of Study</label>
            <input type="text" id="programSearch" placeholder="Search program..." onkeyup="filterPrograms()">
            <div id="programList" class="program-list"></div>
            <div id="selectedProgram" class="selected-program" style="display:none"></div>
            <input type="hidden" id="programCode">
        </div>
        
        <select id="level">
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
        </select>
        
        <button onclick="login()">Login</button>
        <div id="errorMsg" class="error"></div>
        
        <div class="contact">
            <strong>📞 For Queries & Adjustments:</strong><br>
            Emmanuel Chimombo<br>
            Phone: 0891011842<br>
            Email: e8477633@gmail.com<br><br>
            ⚠️ Queries beyond mechanical errors must be directed to your Head of Department
        </div>
    </div>

    <script>
        let currentRole = 'lecturer';
        let allPrograms = [];
        
        // Load programs from server
        async function loadPrograms() {
            try {
                let res = await fetch('/api/programs');
                allPrograms = await res.json();
                displayPrograms(allPrograms);
            } catch(e) {
                console.error('Error loading programs:', e);
                // Fallback programs
                allPrograms = ["Bachelor of Education ICT", "Bachelor of Education (Science)", "BSc Information Communication Technology"];
                displayPrograms(allPrograms);
            }
        }
        
        function displayPrograms(programs) {
            let html = '';
            programs.forEach(prog => {
                html += `<div class="program-item" onclick="selectProgram('${prog.replace(/'/g, "\\'")}')">${prog}</div>`;
            });
            document.getElementById('programList').innerHTML = html;
        }
        
        function filterPrograms() {
            let search = document.getElementById('programSearch').value.toLowerCase();
            let filtered = allPrograms.filter(p => p.toLowerCase().includes(search));
            displayPrograms(filtered);
        }
        
        function selectProgram(program) {
            document.getElementById('programCode').value = program;
            document.getElementById('selectedProgram').innerHTML = `✅ Selected: ${program}`;
            document.getElementById('selectedProgram').style.display = 'block';
            document.getElementById('programList').style.display = 'none';
        }
        
        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('errorMsg').innerHTML = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            if (role === 'lecturer') {
                document.getElementById('username').placeholder = 'e.g., lecturer_BED_ICT_l1';
                document.getElementById('passwordHint').innerHTML = '🔒 Password is hidden for security (ask HOD or ICT)';
                document.getElementById('programSection').style.display = 'none';
            } else {
                document.getElementById('username').placeholder = 'e.g., student_BED_ICT_l1_1';
                document.getElementById('passwordHint').innerHTML = '🔓 Student Password: <strong>student123</strong>';
                document.getElementById('programSection').style.display = 'block';
                document.getElementById('programList').style.display = 'block';
                document.getElementById('selectedProgram').style.display = 'none';
                document.getElementById('programSearch').value = '';
                displayPrograms(allPrograms);
            }
        }
        
        async function login() {
            let username = document.getElementById('username').value.trim();
            let password = document.getElementById('password').value;
            let level = document.getElementById('level').value;
            let program = document.getElementById('programCode').value;
            
            if (!username || !password) {
                document.getElementById('errorMsg').innerHTML = 'Please enter username and password';
                return;
            }
            
            if (currentRole === 'student' && !program) {
                document.getElementById('errorMsg').innerHTML = 'Please select your program of study';
                return;
            }
            
            if (currentRole === 'lecturer') {
                if (username === "lecturer_BED_ICT_l1" && password === "lecturer123") {
                    localStorage.setItem('user', JSON.stringify({
                        role: 'lecturer',
                        name: 'Dr. Banda',
                        program: 'BED_ICT',
                        level: level
                    }));
                    window.location.href = 'lecturer-dashboard.html';
                } else {
                    document.getElementById('errorMsg').innerHTML = 'Invalid lecturer credentials. Contact HOD for password.';
                }
            } else {
                if (username === "student_BED_ICT_l1_1" && password === "student123") {
                    localStorage.setItem('user', JSON.stringify({
                        role: 'student',
                        name: 'Student',
                        program: program,
                        level: level
                    }));
                    window.location.href = 'student-dashboard.html';
                } else {
                    document.getElementById('errorMsg').innerHTML = 'Invalid student credentials. Use student123 as password.';
                }
            }
        }
        
        loadPrograms();
    </script>
</body>
</html>
